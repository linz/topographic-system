name: push

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version

      - name: Python CI
        id: python-ci
        uses: ./.github/actions/python-ci
        background: true

      - run: npm ci

      - run: npm run build

      - run: npm run bundle

      - run: npm run check
        id: check
        background: true

      - run: npm run test
        id: test
        background: true

      - wait: [check, test, python-ci]
      - run: git diff --exit-code

      # Publish the generated schemas for long-term, versioned history (see
      # packages/typespec-emitter and packages/schema/src/features/common.tsp). Only on push to
      # master, after everything above has passed -- PRs build and check the same schemas, just
      # don't publish them. `aws s3 sync` never deletes: older versions already in the bucket stay
      # published even after they're dropped from the local `Versions` enum.
      - name: Configure AWS Credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: aws-actions/configure-aws-credentials@v6.2.1
        with:
          aws-region: ap-southeast-2
          mask-aws-account-id: true
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Sync schemas to S3
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: aws s3 sync schema/ s3://linz-topography-nonprod/schema/

  build-container:
    uses: ./.github/workflows/containers.yml
    with:
      manifest: '{ "map": [], "kart": [] }'
    secrets: inherit

  visual-diff:
    needs: build-container
    if: ${{ !github.event.pull_request.head.repo.fork }}
    uses: ./.github/workflows/visual-diff.yml
    with:
      environment: nonprod #TODO: Enable prod when data is read "${{ startsWith(github.event.pull_request.title, 'chore: release') && 'prod' || 'nonprod' }}"
      # `github.sha` is the ephemeral merge commit on pull requests, use the head commit instead
      map_version: 'git-${{ github.event.pull_request.head.sha || github.sha }}'
      project: https://d1jzh93b1t1cv.cloudfront.net/qgis/nztopo50/latest/nztopo50.json
    secrets: inherit

  test-kart-workflow:
    needs: build-container
    uses: ./.github/workflows/data-review.yml
    secrets: inherit
    with:
      clone_url: https://github.com/linz/topographic-test-data.git
      head_ref: master
      environment: nonprod
      changed_datasets_only: false
      output: file:///tmp/topographic-data/
      kart_version: 'git-${{ github.event.pull_request.head.sha || github.sha }}'

  test-end-2-end:
    needs: build-container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version

      - run: npm ci

      - run: |
          node e2e/index.ts \
            --verbose \
            --container-kart=ghcr.io/linz/topographic-system/kart:git-${{ github.event.pull_request.head.sha || github.sha }} \
            --container-map=ghcr.io/linz/topographic-system/map:git-${{ github.event.pull_request.head.sha || github.sha }}

  test-end-2-end-kart-import:
    needs: build-container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version

      - run: npm ci

      - run: |
          node e2e/index.import.ts \
            --verbose \
            --container-kart=ghcr.io/linz/topographic-system/kart:git-${{ github.event.pull_request.head.sha || github.sha }} \
            --container-map=ghcr.io/linz/topographic-system/map:git-${{ github.event.pull_request.head.sha || github.sha }}
