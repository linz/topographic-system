name: push

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version

      - name: Python CI
        id: python-ci
        uses: ./.github/actions/python-ci
        background: true

      # Remove existing schema files to ensure no dangling json schemas.
      - run: rm -rfv schema/

      - run: npm ci

      - run: npm run build

      - run: npm run bundle

      - run: npm run check
        id: check
        background: true

      - run: npm run test
        id: test
        background: true

      - wait: [check, test, python-ci]
      - run: git diff --exit-code

      - name: Configure AWS Credentials
        if: github.ref == 'refs/heads/master' && github.event_name == 'push' && env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v6.2.1
        with:
          aws-region: ap-southeast-2
          mask-aws-account-id: true
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Push Schemas to STAC
        if: github.ref == 'refs/heads/master' && github.event_name == 'push' && env.AWS_ROLE_ARN != ''
        run: |
          RELEASES=($(ls -d schema/release=v* | sort -V))
          LATEST="${RELEASES[-1]}"

          for RELEASE_DIR in "${RELEASES[@]}"; do
            VERSION="${RELEASE_DIR#schema/release=}"
            if [ "$RELEASE_DIR" = "$LATEST" ]; then
              echo "Pushing latest release $VERSION with virtual latest/..."
              node --experimental-strip-types packages/map/src/index.ts stac-push \
                --source="$RELEASE_DIR/collection.json" \
                --target="${{ env.SCHEMA_S3_TARGET || 's3://linz-topographic/' }}" \
                --category=schema \
                --strategy="release=$VERSION" \
                --strategy=latest \
                --commit
            else
              echo "Pushing release $VERSION..."
              node --experimental-strip-types packages/map/src/index.ts stac-push \
                --source="$RELEASE_DIR/collection.json" \
                --target="${{ env.SCHEMA_S3_TARGET || 's3://linz-topographic/' }}" \
                --category=schema \
                --strategy="release=$VERSION" \
                --commit
            fi
          done

  build-container:
    uses: ./.github/workflows/containers.yml
    with:
      manifest: '{ "map": [], "kart": [] }'
    secrets: inherit

  visual-diff:
    needs: build-container
    if: ${{ !github.event.pull_request.head.repo.fork }}
    uses: ./.github/workflows/visual-diff.yml
    with:
      environment: nonprod #TODO: Enable prod when data is read "${{ startsWith(github.event.pull_request.title, 'chore: release') && 'prod' || 'nonprod' }}"
      # `github.sha` is the ephemeral merge commit on pull requests, use the head commit instead
      map_version: 'git-${{ github.event.pull_request.head.sha || github.sha }}'
      project: https://d1jzh93b1t1cv.cloudfront.net/qgis/nztopo50/latest/nztopo50.json
    secrets: inherit

  test-kart-workflow:
    needs: build-container
    uses: ./.github/workflows/data-review.yml
    secrets: inherit
    with:
      clone_url: https://github.com/linz/topographic-test-data.git
      head_ref: master
      environment: nonprod
      changed_datasets_only: false
      output: file:///tmp/topographic-data/
      kart_version: 'git-${{ github.event.pull_request.head.sha || github.sha }}'

  test-end-2-end:
    needs: build-container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version

      - run: npm ci

      - run: |
          node e2e/index.ts \
            --verbose \
            --container-kart=ghcr.io/linz/topographic-system/kart:git-${{ github.event.pull_request.head.sha || github.sha }} \
            --container-map=ghcr.io/linz/topographic-system/map:git-${{ github.event.pull_request.head.sha || github.sha }}

  test-end-2-end-kart-import:
    needs: build-container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version

      - run: npm ci

      - run: |
          node e2e/index.import.ts \
            --verbose \
            --container-kart=ghcr.io/linz/topographic-system/kart:git-${{ github.event.pull_request.head.sha || github.sha }} \
            --container-map=ghcr.io/linz/topographic-system/map:git-${{ github.event.pull_request.head.sha || github.sha }}
