name: deploy-schema

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub environment to run the workflow in.'
        type: string
        required: true

jobs:
  deploy-schema:
    environment:
      name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .node-version

      - run: npm ci

      - run: npm run -w packages/schema bundle

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.1
        with:
          aws-region: ap-southeast-2
          mask-aws-account-id: true
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Sync schemas to S3
        run: aws s3 sync schema/ s3://linz-topography-nonprod/schema/ --cache-control "public, max-age=60"
