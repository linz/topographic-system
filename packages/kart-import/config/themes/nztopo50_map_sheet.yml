name: nztopo50_map_sheet
target_repo: topographic-product-data
# Stored in NZGD2000 lat/long so mainland and offshore island sheets share one dataset;
# `epsg` is the projection each sheet is drawn in (origin_x/origin_y are in that projection)
target_epsg: EPSG:4167
datasets:
  - source:
      url: git@github.com:linz/topographic-source-data
      dataset: linz_map_sheet
    name: linz_map_sheet
    feature_key: auto_pk
    depends_on_themes: [trig_point, geographic_name]
    mapping:
      t50_fid: $
      type: nztopo50_map_sheet
      sheet_code: $
      sheet_name: $
      epsg: 2193 # NZTM2000
      origin_x: { fixup: true }
      origin_y: { fixup: true }
      cover_front_origin_x: { source: $, since_release: 66 }
      cover_front_origin_y: { source: $, since_release: 66 }
      cover_back_origin_x: { source: $, since_release: 66 }
      cover_back_origin_y: { source: $, since_release: 66 }
      barcode: { source: $, since_release: 66 }
      example_point_id: { fixup: true }
      example_name: { source: $ex_name, fixup: true }
      example_class: { source: $ex_class, fixup: true }
      published_version: { source: $edition, fixup: true }
      published_at: { fixup: true }
    fixups:
      - fn: map_sheet_drop_index_sheets
      - fn: map_sheet_origin
      - fn: map_sheet_example_name_fixes
      - fn: map_sheet_example_point_id
      - fn: map_sheet_published

  # nzoi: offshore island sheets, drawn in their own TM2000
  - source:
      url: git@github.com:linz/topographic-source-data
      dataset: snares_map_sheet
    name: snares_map_sheet
    feature_key: auto_pk
    depends_on_themes: [trig_point, geographic_name]
    mapping:
      t50_fid: null
      type: nztopo50_map_sheet
      sheet_code: $
      sheet_name: $
      epsg: 3788 # Auckland Islands TM2000
      origin_x: { fixup: true }
      origin_y: { fixup: true }
      cover_front_origin_x: null
      cover_front_origin_y: null
      cover_back_origin_x: null
      cover_back_origin_y: null
      barcode: null
      example_point_id: { fixup: true }
      example_name: { source: $ex_name, fixup: true }
      example_class: { source: $ex_class, fixup: true }
      published_version: { source: $edition, fixup: true }
      published_at: { fixup: true }
    fixups:
      - fn: map_sheet_origin
      - fn: map_sheet_example_point_id
      - fn: map_sheet_published
