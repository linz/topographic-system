name: landuse
target_repo: topographic-data
target_epsg: EPSG:4167
datasets:
  - source: kart@data.koordinates.com:linz/nz-cemetery-polygons-topo-150k
    mapping:
      t50_fid: $
      type: cemetery
      subtype: null
      status: null
      name: $
      substance_extracted: null
      theme: landuse
      metadata: null
  - source: kart@data.koordinates.com:linz/nz-chatham-island-cemetery-polygons-topo-150k
    mapping:
      t50_fid: $
