      theme: landuse
      metadata: null
  - source: kart@data.koordinates.com:linz/nz-mine-polygons-topo-150k
    mapping:
      t50_fid: $
      type: mine
      subtype: $visibility
      status: $
      name: $
      substance_extracted: $substance
      theme: landuse
      metadata: null
    corrections:
      - { column: status, replace: { historic: old } }
