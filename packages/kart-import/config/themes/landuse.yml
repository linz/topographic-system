      metadata: null
  - source: kart@data.koordinates.com:linz/nz-quarry-polygons-topo-150k
    mapping:
      t50_fid: $
      type: quarry
      subtype: null
      status: $
      name: $
      substance_extracted: $substance
      theme: landuse
      metadata: null
    corrections:
      - { column: substance_extracted, replace: { 'silica sand': silica_sand } }
  - source: kart@data.koordinates.com:linz/nz-chatham-island-quarry-polygons-topo-150k
    mapping:
      t50_fid: $
      type: quarry
      subtype: null
      status: $
      name: $
      substance_extracted: $substance
      theme: landuse
      metadata: null
    corrections:
      - { column: substance_extracted, replace: { 'silica sand': silica_sand } }
  - source: kart@data.koordinates.com:linz/nz-racetrack-polygons-topo-150k
    mapping:
      t50_fid: $
      type: { source: $track_use, default: racetrack }
      subtype: $track_type
      status: null
      name: $
      substance_extracted: null
      theme: landuse
      metadata: null
    corrections:
      - column: type
        replace:
          horse: horse_track
          vehicle: vehicle_track
          cycle: cycle_track
          dog: dog_track
  - source: kart@data.koordinates.com:linz/nz-rifle-range-polygons-topo-150k
