    mapping:
      t50_fid: $
      type: golf_course
      subtype: null
      status: null
      name: $
      substance_extracted: null
      theme: landuse
      metadata: null
  - source: kart@data.koordinates.com:linz/nz-chatham-island-golf-course-polygons-topo-150k
