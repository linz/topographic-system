name: structure_point
target_repo: topographic-data
target_epsg: EPSG:4167
datasets:
  # -------- beacon
  # Per FTM schema feedback (page 19): raw `type` column distinguishes plain
  # beacons from lighthouses ("lighthouse" is a valid structure_subtype
  # value; plain "beacon" is not, so it corrects to null). The raw
  # `location` (land/sea) column has no schema field yet and is dropped —
  # a "type=lighthouse, subtype=location" alternative was proposed but not
  # adopted.
  # nz
  - source: kart@data.koordinates.com:linz/nz-beacon-points-topo-150k
    name: nz_beacon_points_topo_150k
    mapping: &beacon
      t50_fid: $
      type: beacon
      subtype: $type
      tank_type: null
      status: $
      name: $
      height: null
      orientation: null
      theme: structures
      metadata: null
    corrections: &beacon_corrections
      - column: subtype
        replace:
          beacon: null
  - source: kart@data.koordinates.com:linz/nz-chatham-island-beacon-points-topo-150k
    name: nz_chatham_island_beacon_points_topo_150k
    mapping: *beacon
    corrections: *beacon_corrections
  # # pi
  # - source: kart@data.koordinates.com:linz/cook-islands-beacon-points-topo-150k-zone3
  #   name: cook_islands_beacon_points_topo_150k_zone3
  #   mapping: *beacon
  #   corrections: *beacon_corrections
  # - source: kart@data.koordinates.com:linz/cook-islands-beacon-points-topo-125k-zone4
  #   name: cook_islands_beacon_points_topo_125k_zone4
