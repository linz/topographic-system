name: land_use_point
target_repo: topographic-data
target_epsg: EPSG:4167
schema_version:
  default: v0.3
datasets:
  - source: kart@data.koordinates.com:linz/nz-mine-points-topo-150k
    mapping:
      t50_fid: $
      type: mine
      subtype: $visibility
      status: $
      name: $
      substance_extracted: $substance
      theme: land_use
      metadata: null
    corrections:
      # `Historic` (capitalized, release 48, 1 feature) is the same value as `historic`.
      - { column: status, replace: { historic: old, Historic: old } }
