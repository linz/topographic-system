  #      theme: transport
  #      metadata: null
  - source: kart@data.koordinates.com:linz/nz-track-centrelines-topo-150k
    mapping:
      t50_fid: $
      type: track
      name: $
      status: $
      track_type: $
      subtype: $track_use
      theme: transport
      metadata: null
    fixups:
      - fn: drop_degenerate_tracks # near-zero-length lines that collapse to LINESTRING EMPTY on rounding
    corrections:
      - { column: subtype, replace: { 'cycle only': cycle_only } }
      # `poled route` (releases 30-58, up to 397 features) needs a track_type enum value
      # (BM-1783); snake_cased here as the legacy loader did. `routeroute` is a source typo
      # (1 feature, release 63).
      - { column: track_type, replace: { 'poled route': poled_route, routeroute: route } }
