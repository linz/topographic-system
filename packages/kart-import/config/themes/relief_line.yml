name: relief_line
target_repo: topographic-data
target_epsg: EPSG:4167
datasets:
  # -------- cliff_edge
  # nz
  - source: kart@data.koordinates.com:linz/nz-cliff-edges-topo-150k
    name: nz_cliff_edges_topo_150k
    mapping: &cliff_edge
      t50_fid: $
      type: cliff_edge
      subtype: null
      name: null
      height: null
      theme: relief
      metadata: null
  - source: kart@data.koordinates.com:linz/nz-chatham-island-cliff-edges-topo-150k
    name: nz_chatham_island_cliff_edges_topo_150k
