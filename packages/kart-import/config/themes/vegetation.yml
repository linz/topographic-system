    mapping: *native
  - source: kart@data.koordinates.com:linz/tokelau-native-polygons-topo-125k
    name: tokelau_native_polygons_topo_125k
    mapping: *native

  # -------- scattered_scrub
  # nz
  - source: kart@data.koordinates.com:linz/nz-scattered-scrub-polygons-topo-150k
    name: nz_scattered_scrub_polygons_topo_150k
    mapping: &scattered_scrub
      t50_fid: $
      type: scattered_scrub
      subtype: null
      theme: landcover
      metadata: null
  - source: kart@data.koordinates.com:linz/nz-chatham-island-scattered-scrub-polygons-topo-150k
