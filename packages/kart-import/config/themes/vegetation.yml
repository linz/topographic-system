name: vegetation
target_repo: topographic-data
target_epsg: EPSG:4167
datasets:
  # -------- exotic
  # Per FTM schema feedback (item 620): species moves into subtype; where
  # species is null for exotic features, default subtype to "coniferous".
  # nz
  - source: kart@data.koordinates.com:linz/nz-exotic-polygons-topo-150k
    name: nz_exotic_polygons_topo_150k
    mapping: &exotic
      t50_fid: $
      type: exotic
      subtype: { source: $species, default: coniferous }
      theme: landcover
      metadata: null
  - source: kart@data.koordinates.com:linz/nz-chatham-island-exotic-polygons-topo-150k
    name: nz_chatham_island_exotic_polygons_topo_150k
    mapping: *exotic

  # -------- native
  # nz
  - source: kart@data.koordinates.com:linz/nz-native-polygons-topo-150k
    name: nz_native_polygons_topo_150k
    mapping: &native
      t50_fid: $
      type: native
      subtype: null
      theme: landcover
      metadata: null
  - source: kart@data.koordinates.com:linz/nz-chatham-island-native-polygons-topo-150k
    name: nz_chatham_island_native_polygons_topo_150k
    mapping: *native
  # nzoi
  - source: kart@data.koordinates.com:linz/nz-auckland-island-native-polygons-topo-150k
    name: nz_auckland_island_native_polygons_topo_150k
    mapping: *native
  - source: kart@data.koordinates.com:linz/nz-kermadec-is-native-polygons-topo-125k
    name: nz_kermadec_is_native_polygons_topo_125k
    mapping: *native
  - source: kart@data.koordinates.com:linz/nz-snares-island-tini-heke-native-polygons-topo-125k
    name: nz_snares_island_tini_heke_native_polygons_topo_125k
    mapping: *native
  # pi
  - source: kart@data.koordinates.com:linz/cook-islands-native-polygons-topo-125k-zone3
