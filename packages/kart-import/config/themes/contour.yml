name: contour
target_repo: topographic-contour-data
target_epsg: EPSG:4167

# Reusable mappings, referenced by datasets below via YAML aliases (*name).
# `_mappings` is not part of the theme schema; the config loader ignores it.
_mappings:
  contour: &contour
    t50_fid: $
    # `type` and `subtype` are set by the `contour_type` fixup from `designated`, `nat_form` and
    # `elevation`; `designated` and `nat_form` are only read by the fixup and then dropped.
    type: { source: intermediate, fixup: true }
    subtype: { source: null, fixup: true }
    elevation: $elevation
    designated: { source: $, fixup: true }
    nat_form: { source: $, fixup: true }
    theme: relief
    metadata: null

# Every contour dataset gets its type and subtype from the same rule (BM-1916).
# `_fixups` is not part of the theme schema; the config loader ignores it.
_fixups:
  contour_type: &contour_type
    - fn: contour_type

datasets:
  # -------- contour
  # nz
  - source: kart@data.koordinates.com:linz/nz-contours-topo-150k
    name: nz_contours_topo_150k
    mapping: *contour
    fixups: *contour_type
    corrections:
      # Source data error: this contour is published at 570 m, which is off the 20 m contour
      # interval. Its correct elevation is 580 m. It can't be fixed in the source data yet, so it
      # is corrected here. Matching on the old elevation too means this stops applying once the
      # source is fixed.
      - column: elevation
        set: 580
        where:
          t50_fid: 1023115
          elevation: 570
  - source: kart@data.koordinates.com:linz/nz-chatham-island-contours-topo-150k
    name: nz_chatham_island_contours_topo_150k
    mapping: *contour
    fixups: *contour_type
  # nzoi
  # Offshore-island contours carry no Topo50 fid, so key on Kart's auto_pk and null the t50_fid.
  - source: kart@data.koordinates.com:linz/nz-antipodes-island-contours-topo-125k
    name: nz_antipodes_island_contours_topo_125k
    feature_key: auto_pk
    mapping:
      <<: *contour
      t50_fid: null
    fixups: *contour_type
  - source: kart@data.koordinates.com:linz/nz-auckland-island-contours-topo-150k
    name: nz_auckland_island_contours_topo_150k
    feature_key: auto_pk
    mapping:
      <<: *contour
      t50_fid: null
    fixups: *contour_type
  - source: kart@data.koordinates.com:linz/nz-bounty-islands-contours-topo-125k
    name: nz_bounty_islands_contours_topo_125k
    feature_key: auto_pk
    mapping:
      <<: *contour
      t50_fid: null
    fixups: *contour_type
  - source: kart@data.koordinates.com:linz/nz-campbell-island-motu-ihupuku-contours-topo-150k
    name: nz_campbell_island_motu_ihupuku_contours_topo_150k
    feature_key: auto_pk
    mapping:
      <<: *contour
      t50_fid: null
    fixups: *contour_type
  - source: kart@data.koordinates.com:linz/nz-kermadec-is-contours-topo-125k
    name: nz_kermadec_is_contours_topo_125k
    feature_key: auto_pk
    mapping:
      <<: *contour
      t50_fid: null
    fixups: *contour_type
  - source: kart@data.koordinates.com:linz/nz-snares-island-tini-heke-contours-topo-125k
    name: nz_snares_island_tini_heke_contours_topo_125k
    feature_key: auto_pk
    mapping:
      <<: *contour
      t50_fid: null
    fixups: *contour_type
