name: nztopo50_carto_symbol
target_repo: topographic-product-data
target_epsg: EPSG:2193
schema_version:
  default: v0.3

# land_use and road_line are read from the themes this run builds, not cloned from topographic-data,
# so building topographic-product-data never needs another target repo. contour still clones
# topographic-contour-data until building the contour theme here is shown to be affordable.
lookups:
  - name: land_use
    theme: land_use
    columns: [id]
    geometry: true

  - name: contour
    source:
      url: git@github.com:linz/topographic-contour-data
      dataset: contour
    columns: [id, elevation]
    geometry: true

  - name: road_line
    theme: road_line
    columns: [id, highway_number]
    geometry: true

datasets:
  - source:
      url: git@github.com:linz/topographic-source-data
      dataset: golf_sym
    name: golf_sym
    joins:
      - lookup: land_use
        predicate: within
    mapping:
      metadata: { source: $land_use.id, fixup: true }
      type: golf_course
      label: null
      orientation: null
      t50_fid: null
    fixups:
      - fn: build_carto_symbol_metadata

  - source:
      url: git@github.com:linz/topographic-source-data
      dataset: mine_sym
    name: mine_sym
    joins:
      - lookup: land_use
        predicate: within
    mapping:
      metadata: { source: $land_use.id, fixup: true }
      type: $mine_vis
      t50_fid: null
      label: null
      orientation: null
    fixups:
      - fn: build_carto_symbol_metadata
    corrections:
      - column: type
        replace:
          training: mine_training
          opencast: mine_opencast
          underground: mine_underground

  - source:
      url: git@github.com:linz/topographic-source-data
      dataset: linz_highway_sh
    name: linz_highway_sh
    joins:
      - lookup: road_line
        predicate: nearest
        max_distance: 1
    mapping:
      metadata: { source: $road_line.id, fixup: true }
      type: highway_shield
      label: $road_line.highway_number
      orientation: null
      t50_fid: null
    fixups:
      - fn: build_carto_symbol_metadata

  - source:
      url: git@github.com:linz/topographic-source-data
      dataset: contour_number
    name: contour_number
    joins:
      - lookup: contour
        predicate: nearest
        max_distance: 20
        chop: 64
    mapping:
      metadata: { source: $contour.id, fixup: true }
      type: contour_number
      label: $contour.elevation
      orientation: $orientation
      cont_rota: { source: $, fixup: true }
      t50_fid: null
    fixups:
      - fn: contour_number
      - fn: build_carto_symbol_metadata
