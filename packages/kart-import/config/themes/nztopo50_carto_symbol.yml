name: nztopo50_carto_symbol
target_repo: topographic-product-data
target_epsg: EPSG:2193

datasets:
  - source:
      url: git@github.com:linz/topographic-source-data
      dataset: golf_sym
    name: golf_sym
    mapping:
      type: golf_course
      label: null
      orientation: null
      t50_fid: null

  - source:
      url: git@github.com:linz/topographic-source-data
      dataset: mine_sym
    name: mine_sym
    mapping:
      type: $mine_vis
      t50_fid: null
      label: null
      orientation: null
    corrections:
      - column: type
        replace:
          training: mine_training
          opencast: mine_opencast
          underground: mine_underground
