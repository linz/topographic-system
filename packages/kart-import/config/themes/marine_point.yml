name: marine_point
target_repo: topographic-data
target_epsg: EPSG:4167
datasets:
  - source: kart@data.koordinates.com:linz/nz-rock-points-topo-150k
    mapping:
      t50_fid: $
      type: rock
      # Source carries no composition attribute, so the subtype stays null.
      subtype: null
      name: $name
      theme: landcover
      metadata: null
  - source: kart@data.koordinates.com:linz/nz-chatham-island-rock-points-topo-150k
    mapping:
      t50_fid: $
      type: rock
      subtype: null
      name: $name
      theme: landcover
      metadata: null
