name: tunnel_line
target_repo: topographic-data
target_epsg: EPSG:4167
schema_version:
  default: v0.3
datasets:
  - source: kart@data.koordinates.com:linz/nz-tunnel-centrelines-topo-150k
    mapping:
      t50_fid: $
      type: $use1
      subtype: $use2
      construction_type: $type
      status: $status
      name: $name
      theme: transport
      metadata: null
    corrections:
      - { column: type, replace: { 'foot traffic': foot_traffic } }
      # Release 45 bug: 'foot traffic' (space) in subtype - remove it since subtype should only be livestock
      - { column: subtype, set: null, where: { subtype: 'foot traffic' } }
      - { column: subtype, set: null, where: { subtype: 'foot_traffic' } }
      - { column: subtype, replace: { ivestock: livestock, 'live stock': livestock } }
      - { column: status, replace: { 'under construction': under_construction } }
      # FALSE is not a valid status value; it represents missing/unknown status
      - { column: status, set: null, where: { status: 'FALSE' } }
      # Releases 34-43: 'farm' in subtype is invalid; subtype only allows 'livestock' or null
      # These are foot_traffic tunnels, so subtype should be null
      - { column: subtype, set: null, where: { subtype: 'farm' } }
      # A handful of releases have use1/use2 swapped: `vehicle` lands in use2 and `livestock` in use1. Put each back in its own column.
      - { column: type, set: vehicle, where: { subtype: vehicle } }
      - { column: subtype, set: livestock, where: { subtype: vehicle } }
