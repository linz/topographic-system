  - source: kart@data.koordinates.com:linz/nz-chatham-island-building-points-topo-150k
    mapping:
      t50_fid: $
      type: building
      subtype: $bldg_use
      status: $status
      name: $name
      orientation: null
      theme: buildings
      metadata: null
    corrections:
      - column: subtype
        replace:
          'gun club': gun_club
      - column: subtype
        set: null
        where:
          subtype: 'fire station'
          t50_fid: 5448500
      - column: subtype
        set: null
        where:
          subtype: 'police station'
          t50_fid: 5448451
