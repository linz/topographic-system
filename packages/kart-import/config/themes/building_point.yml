  - source: kart@data.koordinates.com:linz/nz-building-points-topo-150k-2
    name: nz_building_points
    mapping:
      t50_fid: $
      type: building
      subtype: $bldg_use
      status: $status
      name: $name
      orientation: { source: $orientatn, since_release: 49 }
      theme: buildings
      metadata: null
    corrections:
      - column: subtype
        replace:
          'cement works': cement_works
          'energy facility': energy_facility
          'fertiliser works': fertiliser_works
          'fertilizer works': fertiliser_works # US spelling, early releases
          'fire lookout': fire_lookout
          'forest headquarters': forest_headquarters
          'gas compound': gas_compound
          'gun club': gun_club
          'gun emplacement': gun_emplacement
          'power generation': power_generation
          'power station': power_generation # 1 feature, release 36
          'private hut': private_hut
          'sch': school # source typo, 1 feature, release 41
          'sunstation': substation # source typo, 1 feature, release 36
          'salt works': salt_works
          'shingle works': shingle_works
          'stamping battery': stamping_battery
          'surf club': surf_club
          'visitor centre': visitor_centre
          'water treatment plant': water_treatment_plant
          'Hut': hut
      # "Mountain View Farm" (1 feature, release 63) has a truncated `homestea` typed into
      # status with an empty bldg_use; move it to the subtype it belongs in.
      - { column: subtype, set: homestead, where: { status: homestea } }
      - { column: status, replace: { homestea: null } }
      - { column: subtype, set: null, where: { t50_fid: 6744342, subtype: tank } }
      - { column: subtype, set: null, where: { t50_fid: 7862766, subtype: 'research station' } }
      - { column: subtype, set: null, where: { t50_fid: 7862767, subtype: 'research station' } }
      - { column: subtype, set: null, where: { t50_fid: 7862768, subtype: 'research station' } }
  # needs t50_fid backfilled
  #  - source: kart@data.koordinates.com:linz/nz-campbell-island-motu-ihupuku-building-points-topo-150k
