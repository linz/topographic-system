name: landcover
target_repo: topographic-data
target_epsg: EPSG:4167
datasets:
  # -------- ice
  # nz
  - source: kart@data.koordinates.com:linz/nz-ice-polygons-topo-150k
    name: nz_ice_polygons_topo_150k
    mapping: &ice
      t50_fid: $
      type: ice
      name: null
      theme: landcover
      metadata: null
  # ant
  - source: kart@data.koordinates.com:linz/nz-ross-dependency-ice-polygons-ant-150k
    name: nz_ross_dependency_ice_polygons_ant_150k
