name: geographic_name
target_repo: topographic-data
target_epsg: EPSG:4167

# Reusable mappings, referenced by datasets below via YAML aliases (*name).
# `_mappings` is not part of the theme schema; the config loader ignores it.
_mappings:
  geographic_name: &geographic_name
    t50_fid: $
    type: $desc_code
    name: $name
    size: $size
    theme: annotation
    metadata: null

# Translate the legacy topo `desc_code` abbreviation into the full-text `type`.
# https://docs.topo.linz.govt.nz/data-dictionary/tdd-class-geographic_name.html
_corrections:
  geo_name_type_corrections: &geo_name_type_corrections
    - column: type
      replace:
        AIR: airport
        BAY: bay_inlet
        BCH: beach
        BDGE: bridge
        BLDG: building
        BNK: bank
        BSN: mountain_basin
        CAVE: cave
        CEM: cemetery
        CGND: camping_ground
        CLIF: cliff
        CRTR: crater
        DAM: dam
        ESTY: estuary
        FALL: waterfall
        FARM: farm
        FLAT: flat
        FORD: ford
        FRST: forest
        GEO: geothermal_area
        GLCR: glacier
        GLKS: golf_links
        GORG: gorge_valley
        HILL: hill
        HIST: historic
        HOSP: hospital
        HSTD: homestead
        HUT: hut
        ISLD: island
        ISTH: isthmus
        LAKE: lake
        LOC: locality
        LTH: lighthouse
        MCUL: miscellaneous_cultural_feature
        METR: metropolis
        MINE: mine
        MNAT: miscellaneous_natural_feature
        MPLA: miscellaneous_place
        MRFM: marine_rock_formation
        NAVB: navigational_beacon
        NLR: native_land_reserve
        PA: pa
        PARK: park
        PASS: pass
        PEN: peninsula
        PNT: point
        POPL: populated_place
        PPLN: pipeline
        RC: racecourse
        RDGE: ridge
        RDRF: road_related_feature
        RLYF: railway_related_feature
        RNGE: range
        ROCK: rock
        RSTN: railway_station
        SBRB: suburb
        SCH: school
        SEA: sea
        SKI: ski
        SLIP: slip
        SPR: spring
        STRA: strait
        STRM: stream
        SWMP: swamp
        TOWN: town
        TRCK: track
        TREE: tree
        TRIG: trig
        TUNL: tunnel
        TWAY: tramway
        UNIV: university
        USAT: urban_satellite
        WELL: well
        WHF: wharf
        WILD: wilderness_area
        WRCK: wreck
        WWAY: water_way

# Split the NZGB combined types `bay_inlet` and `gorge_valley` by feature name
# (see kart_import.fixups.split_bay_inlet_gorge_valley). `_fixups` is not part of
# the theme schema; the config loader ignores it.
_fixups:
  geo_name_split: &geo_name_split
    - fn: split_bay_inlet_gorge_valley

