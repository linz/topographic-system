name: bridge_line
target_repo: topographic-data
target_epsg: EPSG:4167
schema_version:
  default: v0.3
datasets:
  # Only keep NZ datasets for initial load.
  #  - source: kart@data.koordinates.com:linz/cook-islands-bridge-centrelines-topo-125k-zone4
  #    name: cook_islands_bridge_centrelines
  #    mapping:
  #      t50_fid: $
  #      type: $use_1
  #      subtype: $use_2
  #      construction_type: $constr_typ
  #      status: $status
  #      name: $name
  #      theme: transport
  #      metadata: null
  - source: kart@data.koordinates.com:linz/nz-bridge-centrelines-topo-150k
    mapping:
      t50_fid: $
      type: $use_1
      subtype: $use_2
      construction_type: $constr_typ
      status: $status
      name: $name
      theme: transport
      metadata: null
    corrections: &bridge_corrections
      - column: type
        replace:
          foot traffic: foot_traffic
      # `subtype` (bridge_subtype) only has `foot_traffic`/`train` values; a farm bridge's
      # `use_2` carries no meaningful subtype (e.g. "vehicle", which is a `type` on its own).
      - column: subtype
        set: null
        where: { type: farm }
  - source: kart@data.koordinates.com:linz/nz-chatham-island-bridge-centrelines-topo-150k
    mapping:
      t50_fid: $
      type: $use_1
      subtype: $use_2
      construction_type: $constr_typ
      status: $status
      name: $name
      theme: transport
      metadata: null
    corrections: *bridge_corrections
