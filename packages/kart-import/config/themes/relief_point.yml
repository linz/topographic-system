name: relief_point
target_repo: topographic-data
target_epsg: EPSG:4167

# Reusable mappings, referenced by datasets below via YAML aliases (*name).
# `_mappings` is not part of the theme schema; the config loader ignores it.
_mappings:
  height_point: &height_point
    t50_fid: $
    type: height
    name: null
    elevation: $
    height: null
    orientation: null
    theme: relief
    metadata: null

datasets:
  # nz
  - source: kart@data.koordinates.com:linz/nz-saddle-points-topo-150k
    name: nz_saddle_points_topo_150k
    mapping:
      t50_fid: $
      type: saddle
      name: $
      elevation: $
      height: null
      # `orientatn` was added to the source schema on 2020-06-10 (release 50).
      orientation: { source: $orientatn, since_release: 50 }
      theme: relief
      metadata: null

  - source: kart@data.koordinates.com:linz/nz-height-points-topo-150k
    name: nz_height_points_topo_150k
    mapping: *height_point

  - source: kart@data.koordinates.com:linz/nz-sinkhole-points-topo-150k-2
    name: nz_sinkhole_points_topo_150k
    mapping:
      t50_fid: $
      type: sinkhole
      name: null
      elevation: null
      height: null
      orientation: null
      theme: relief
      metadata: null

  # nzoi
  - source: kart@data.koordinates.com:linz/nz-antipodes-island-height-points-topo-125k
    name: nz_antipodes_island_height_points_topo_125k
    feature_key: auto_pk
    mapping:
      <<: *height_point
      t50_fid: null
  - source: kart@data.koordinates.com:linz/nz-auckland-island-height-points-topo-150k
    name: nz_auckland_island_height_points_topo_150k
    feature_key: auto_pk
    mapping:
      <<: *height_point
      t50_fid: null
  - source: kart@data.koordinates.com:linz/nz-snares-island-tini-heke-height-points-topo-125k
    name: nz_snares_island_tini_heke_height_points_topo_125k
    feature_key: auto_pk
    mapping:
      <<: *height_point
      t50_fid: { source: $, since_release: 67 }
  - source: kart@data.koordinates.com:linz/nz-kermadec-is-height-points-topo-125k
    name: nz_kermadec_is_height_points_topo_125k
    feature_key: auto_pk
    mapping:
      <<: *height_point
      t50_fid: null
  - source: kart@data.koordinates.com:linz/nz-campbell-island-motu-ihupuku-height-points-topo-150k
    name: nz_campbell_island_motu_ihupuku_height_points_topo_150k
    feature_key: auto_pk
    mapping:
      <<: *height_point
      t50_fid: null
  - source: kart@data.koordinates.com:linz/nz-bounty-islands-height-points-topo-125k
    name: nz_bounty_islands_height_points_topo_125k
    feature_key: auto_pk
    mapping:
      <<: *height_point
      t50_fid: null
  - source: kart@data.koordinates.com:linz/nz-antipodes-island-sinkhole-points-topo-125k
    name: nz_antipodes_island_sinkhole_points_topo_125k
    feature_key: auto_pk
    mapping:
      t50_fid: null
      type: sinkhole
      name: null
      elevation: null
      height: null
      orientation: null
      theme: relief
      metadata: null

  - source: kart@data.koordinates.com:linz/nz-waterfall-points-topo-150k
    name: nz_waterfall_points_topo_150k
    mapping:
      t50_fid: $
      type: waterfall
      name: $
      elevation: null
      height: $
      # `orientatn` was added to the source schema on 2020-06-10 (release 50).
      orientation: { source: $orientatn, since_release: 50 }
      theme: relief
      metadata: null
