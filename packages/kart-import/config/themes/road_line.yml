name: road_line
target_repo: topographic-data
target_epsg: EPSG:4167
# Enrichment lookup: NZ road extra attributes exported to the topographic-source-data
# kart repo (linz_road_cl), joined on t50_fid. Supplies road_access / width_indicator /
# name_id, which are not in the LDS road-centrelines layer.
lookups:
  - name: road_lkp
    source:
      url: git@github.com:linz/topographic-source-data
      dataset: linz_road_cl
    key: t50_fid
    columns:
      - road_acces # spelling as per source data
      - width
datasets:
  - source: kart@data.koordinates.com:linz/nz-road-centrelines-topo-150k
    mapping:
      t50_fid: $
      type: road
      name: $name
      status: $status
      surface: $surface
      lane_count: $lane_count
      highway_number: $hway_num
      way_count: $way_count
      hierarchy: null
      road_access: $road_lkp.road_acces
      width_indicator: $road_lkp.width
      theme: transport
      metadata: null
    joins:
      - lookup: road_lkp
        left_on: t50_fid
    fixups:
      - fn: drop_degenerate_roads # near-zero-length lines that collapse to LINESTRING EMPTY on rounding
    corrections:
      # Both spellings occur across releases: 'one way' is the LDS value the legacy
      # space->underscore step normalised, '1' the older LAMPS code. Applied together.
      - column: way_count
        replace:
          'one way': one_way
          '1': one_way
      - column: road_access
        replace:
          m: mp
      - column: status
        replace:
          'under construction': under_construction
          disused: closed # t50_fid 7787891/7787892, releases 50-59 only; deleted in release 60
  # Only keep NZ datasets for initial load.
  #  - source: kart@data.koordinates.com:linz/cook-islands-road-centrelines-topo-125k-zone3
  #    name: cook_islands_road_centrelines_zone3
  #    mapping: *regional
  #    corrections: *waycount
  #  - source: kart@data.koordinates.com:linz/cook-islands-road-centrelines-topo-125k-zone4
  #    name: cook_islands_road_centrelines_zone4
  #    mapping: *regional
  #    corrections: *waycount
  #  - source: kart@data.koordinates.com:linz/niue-road-centrelines-topo-150k
  #    mapping: *regional
  #    corrections: *waycount
  - source: kart@data.koordinates.com:linz/nz-chatham-island-road-centrelines-topo-150k
    mapping: &regional
      t50_fid: $
      type: road
      name: $name
      status: $status
      surface: $surface
      lane_count: $lane_count
      highway_number: $hway_num
      way_count: $way_count
      hierarchy: null
      road_access: null
      width_indicator: null
      theme: transport
      metadata: null
    corrections: &waycount
      - column: way_count
        replace:
          'one way': one_way
          '1': one_way
